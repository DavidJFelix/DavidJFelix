name: CI web-apps
# One workflow for every app and package in the web-apps workspace. Turborepo
# decides what actually executes: each task hashes its package's files plus the
# hashes of the packages it depends on, so a change to packages/theme re-runs
# only its consumers and everything else restores from cache. That replaces the
# per-app `paths:` lists this repo used to hand-maintain -- adding an app or a
# package needs no edit here, because the filter below is one glob over the
# whole workspace and the dependency graph does the rest.
#
# Repo-root config that turbo cannot hash (it sits above the workspace root)
# feeds the cache key through bin/turbo-run.ts, which is why those files appear
# in the filter but not in turbo.json.
on:
  push:
    branches: [main]
    paths:
      - 'workspaces/web-apps/**'
      - '.config/mise.toml'
      - '.config/mise.lock'
      - '.oxfmtrc.json'
      - '.prettierrc.json'
      - 'bin/**'
      - '.depot/workflows/ci-web-apps.yml'
      - '.depot/actions/setup-web-apps/**'
      - '.depot/actions/setup-mise/**'
      - '.depot/actions/setup-playwright/**'
  pull_request:
    paths:
      - 'workspaces/web-apps/**'
      - '.config/mise.toml'
      - '.config/mise.lock'
      - '.oxfmtrc.json'
      - '.prettierrc.json'
      - 'bin/**'
      - '.depot/workflows/ci-web-apps.yml'
      - '.depot/actions/setup-web-apps/**'
      - '.depot/actions/setup-mise/**'
      - '.depot/actions/setup-playwright/**'
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TURBO_TELEMETRY_DISABLED: '1'
jobs:
  # The cached bulk. --continue reports every failing package in one run
  # instead of stopping at the first, which is what the per-app workflows gave
  # us for free by being separate.
  check:
    name: turbo (typecheck, lint, format, build, test)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup web-apps
        uses: ./.depot/actions/setup-web-apps
      - name: turbo run
        run: bun bin/turbo-run.ts typecheck lint format build test --continue

  # Never cached (turbo.json sets cache: false): the smoke boot is the gate
  # that proves a deployable app still serves. The build it depends on does
  # restore from cache. Runs serially -- see the mise task for why.
  smoke:
    name: turbo smoke (local production boot)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup web-apps
        uses: ./.depot/actions/setup-web-apps
      - name: turbo run
        run: mise run smoke

  # Scoped to djf.io deliberately: it is the only app whose Playwright suite
  # ran in CI before this workflow existed. Every other app's e2e suite runs
  # against its deployed preview in the cd-preview path, which is where those
  # suites are configured to point. Widening CI e2e is a scope change, not a
  # migration detail.
  e2e:
    name: turbo test:e2e (djf.io)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workspaces/web-apps/apps/djf.io
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup web-apps
        uses: ./.depot/actions/setup-web-apps
      # Browsers and apt debs both restore from cache; warm runs skip the apt
      # mirrors entirely. Must run with the job's working directory in the app
      # so the version resolve and `bun x` see the app's node_modules.
      - name: setup playwright
        uses: ./.depot/actions/setup-playwright
      - name: turbo run
        working-directory: ${{ github.workspace }}
        run: bun bin/turbo-run.ts test:e2e --filter=@davidjfelix/djf.io
      - name: upload-artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: workspaces/web-apps/apps/djf.io/playwright-report/
          retention-days: 14
