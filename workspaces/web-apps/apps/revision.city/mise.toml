# Canonical check tasks for this app. CI and automation discover checks here;
# tasks delegate to package.json scripts. Assumes `bun install` has run.

[tasks.typecheck]
description = "Type-check with tsc"
run = "bun run typecheck"

[tasks.lint]
description = "Lint with Oxlint + Biome"
run = "bun run lint"

[tasks.format]
description = "Check formatting (oxfmt; Prettier for md/mdx)"
run = "bun run format"

[tasks."format:fix"]
description = "Apply formatting fixes"
run = "bun run format:fix"

[tasks.test]
description = "Unit tests with Vitest (passWithNoTests until the first test lands)"
run = "bun run test"

[tasks.build]
description = "Build with Vite"
run = "bun run build"

[tasks.smoke]
description = "Smoke-test a local production boot (vite preview on workerd)"
depends = ["build"]
run = "bun run smoke"

[tasks.review]
description = "Review a GitHub pull request with the review engine and print the findings"
run = "bun run review"

[tasks."db:generate"]
description = "Write the next D1 migration from src/reviews/lib/schema.ts into drizzle/ (drizzle-kit)"
run = "bun run db:generate"

[tasks."test:e2e"]
description = "E2E + visual-regression tests with Playwright (builds first)"
depends = ["build"]
run = "bun run test:e2e"

[tasks.check]
description = "Run all checks"
depends = ["typecheck", "lint", "format", "test", "build"]
