# Bun install settings for the web-apps workspace. minimumReleaseAge (seconds)
# is the supply-chain cooldown: dependency resolution skips versions published
# within the last 24 hours, matching the cooldown pnpm enforced by default.
# One copy at the workspace root now covers every app and package -- installs
# run here, not per project.

# Root package.json "overrides" context (bun applies overrides from the
# workspace root only, so the per-app pins live there):
# - the rolldown override makes every consumer use one rolldown version.
#   Some consumers depend on an exact rolldown version, so without the
#   override the tree can hold more than one copy. Without CI=1, playwright in
#   djf.io uses a server that already runs on the test port. That
#   server can serve an old build. Before you change the override, run
#   `CI=1 bun run test:e2e` in `apps/djf.io`.
# - the effect, @effect/platform-node-shared, and @effect/sql-d1 overrides use
#   the version that f311x declares for effect and @effect/platform-node, so
#   the tree holds exactly ONE physical effect. Mixed copies were the likely
#   cause of the SchemaAST TypeError on 2026-06-11. @alchemy.run/cloudflare
#   declares @effect/sql-d1 ^4.0.5, which resolves to a newer release whose
#   peer range excludes the pinned effect. Renovate holds effect below 4.1,
#   because alchemy 2.0.0-beta.84 still imports effect/Crypto, which effect 4.1
#   removed (see the effect rule in .github/renovate.json).

# Astro app "devDependencies" context: each Astro app pins @astrojs/check
# beside typescript 6.0.3, the same hold the Svelte and Nuxt apps carry for
# svelte-check and vue-tsc. astro check is built on the TypeScript JS compiler
# API, which typescript 7 (native) does not ship. From 2026-08 to 2026-09 the
# root package.json carried @astrojs/check + typescript 6.0.3 instead, so the
# apps could run typescript 7 while astro check walked up to the root's 6:
# @astrojs/check resolves its typescript peer beside its own instance, so
# wherever it is declared decides which compiler checks the .astro files. astro
# 7.3.4 closed that seam (withastro/astro#18053): `astro check` now resolves
# typescript from the app directory first and refuses to run when that is 7,
# whatever @astrojs/check would have peered with. Renovate holds typescript
# below 7 in every framework-checked app; the Astro apps move to 7 once
# `astro check` is replaced by tsgo plus @astrojs/ts-content-mapper, which
# needs typescript 7.1 (https://github.com/withastro/roadmap/discussions/1321).

# Root package.json "workspaces.catalog" context: the @tanstack entries exist
# so no app declares the `latest` dist-tag -- frozen installs re-resolve
# dist-tags, so an upstream release alone invalidated the lockfile (2026-08-06
# and 2026-08-08 both). react-router and router-plugin must stay the exact
# versions react-start pins internally (react-start's dependency list is the
# source of truth); bump the catalog as one aligned set. This replaced the
# four @tanstack overrides from 2026-08-06 -- with exact aligned versions
# there is no float left to split the tree into two routers. react-devtools
# and devtools-vite version independently and can move on their own.

# Direct dependencies that exist only to pin resolution, not because the app
# imports something new:
# - pkg.dog declares h3 ^1.15.11 even though nuxt already brings it. f311x's
#   @tanstack/start-server-core depends on "h3-v2": "npm:h3@2.0.1-rc.20", and
#   bun hoists that alias under its REAL name, so a bare `h3` in this shared
#   workspace could resolve to v2. Nuxt's generated .nuxt/tsconfig.json mapped
#   h3 there while nitro 2.13.4 bundled v1, so pkg.dog's server routes
#   typechecked against v2 (no toWebRequest) and ran against v1. The direct
#   dep makes types and runtime agree. Drop it when nothing pulls an aliased
#   h3 v2, or when nitro itself moves to v2 and the routes move with it.

[install]
minimumReleaseAge = 86400
