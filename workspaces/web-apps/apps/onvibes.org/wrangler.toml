#:schema node_modules/wrangler/config-schema.json
name = "onvibes-org"
# Custom server entry (src/server.ts) wraps the TanStack Start handler with Sentry
# (@sentry/cloudflare withSentry); @cloudflare/vite-plugin needs this explicit
# entry instead of the default @tanstack/react-start/server-entry
# (cloudflare/workers-sdk#11100). Server-side Sentry reads VITE_PUBLIC_SENTRY_DSN
# (inlined at build, same as the client); no-op until it's set.
main = "src/server.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# This worker serves via custom domains; explicitly keep workers.dev preview
# URLs on so `wrangler versions upload --preview-alias` (cd-preview) gets a
# reachable pr-<N> URL. Does not affect production routing.
preview_urls = true

# The chat route (src/routes/api/chat.ts) talks to OpenRouter with the
# OPENROUTER_API_KEY secret (`wrangler secret put OPENROUTER_API_KEY`; local dev
# and preview read .dev.vars, see .dev.vars.example). Until it is set the route
# answers 503 and the shell shows that chat is not set up.

# Custom domains, wired up in the Cloudflare dashboard.
routes = [
  { pattern = "onvibes.org", custom_domain = true },
  { pattern = "www.onvibes.org", custom_domain = true },
]

# Logs and traces ship to Grafana Cloud through the account-level
# observability destinations configured in the dashboard.
[observability.logs]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-logs"]

[observability.traces]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-traces"]
