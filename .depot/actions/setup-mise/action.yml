name: Setup mise
description: >-
  Install the repo toolchain: the mise-managed tools (node, bun, and the
  non-npm CLIs) with a cache key scoped to the root tool config and lockfile
  (.config/mise.toml + .config/mise.lock), then the repo-root package.json's
  devDependencies -- biome, oxlint, oxfmt, prettier, cspell, warden -- with a
  frozen `bun install` at the repo root. Editing app-level mise.toml (e.g.
  adding tasks) does not bust the shared cache; only genuine tool-version
  bumps do. A stale root bun.lock fails the install here, so a package.json
  edit must ship with its lockfile update.

inputs:
  cache:
    description: Restore and save the mise tool cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: true
        cache: ${{ inputs.cache }}
        cache_key: mise-v1-{{platform}}-${{ hashFiles('.config/mise.toml', '.config/mise.lock') }}

    # Explicit working-directory: run steps in a composite action do not
    # inherit the caller job's default, and several jobs default into an app.
    - name: bun install (repo root)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile
