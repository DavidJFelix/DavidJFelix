allowBuilds:
  # Optional native deps pulled in transitively; not exercised here, so skip
  # their build scripts.
  '@mongodb-js/zstd': false
  '@sentry/cli': true
  # core-js's postinstall is only a funding banner -- no native build to run.
  core-js: false
  # Transitive deps of the Cloudflare `agents` SDK / pi-ai; funding/postinstall
  # banners only, no native build to run.
  '@google/genai': false
  core-js-pure: false
  # esbuild's postinstall fetches its native binary -- a real build, so allow it.
  esbuild: true
  node-liblzma: false
  protobufjs: false
  sharp: true
  workerd: true

overrides:
  # Keeps @earendil-works/pi-ai down to ONE physical copy. pi-ai holds its
  # API-transport registry in module state, so the faux echo provider that
  # src/app.ts registers must live in the same instance @flue/runtime resolves
  # models through -- otherwise registerFauxProvider writes to a registry Flue
  # never reads and the agent endpoint 500s with "No API provider registered for
  # api: onvibes" (the smoke gate catches it). pnpm keys pi-ai by its resolved
  # peer context, and this sdk is the peer that splits it: @flue/runtime asks for
  # ^1.29.0, while @cloudflare/codemode (via the `agents` SDK) declares a
  # ^1.25.0 peer -- a lockfile refresh landed them on 1.30.0 and 1.29.0
  # respectively, giving two pi-ai instances. Both ranges accept 1.30.0. Drop
  # this override once the two agree on a version without help.
  '@modelcontextprotocol/sdk': 1.30.0
