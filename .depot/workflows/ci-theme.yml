name: CI theme package
on:
  push:
    branches: [main]
    paths:
      - 'packages/theme/**'
      - '.config/mise.toml'
      - '.config/mise.lock'
      - 'biome.jsonc'
      - '.oxlintrc.jsonc'
      - '.oxfmtrc.json'
      - '.prettierrc.json'
      - '.depot/workflows/ci-theme.yml'
  pull_request:
    paths:
      - 'packages/theme/**'
      - '.config/mise.toml'
      - '.config/mise.lock'
      - 'biome.jsonc'
      - '.oxlintrc.jsonc'
      - '.oxfmtrc.json'
      - '.prettierrc.json'
      - '.depot/workflows/ci-theme.yml'
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
defaults:
  run:
    working-directory: packages/theme
jobs:
  typecheck:
    name: tsc
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: mise run typecheck
  lint:
    name: oxlint + biome
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: bun install
        run: bun install --frozen-lockfile
      - name: lint
        run: mise run lint
  format:
    name: format check
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: bun install
        run: bun install --frozen-lockfile
      - name: format
        run: mise run format
  vitest:
    name: vitest
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: bun install
        run: bun install --frozen-lockfile
      - name: vitest
        run: mise run test
