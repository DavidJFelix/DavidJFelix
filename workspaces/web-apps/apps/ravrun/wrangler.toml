#:schema node_modules/wrangler/config-schema.json
name = "ravrun"
# Custom server entry (src/server.ts) wraps the TanStack Start handler with
# Sentry (@sentry/cloudflare withSentry). @cloudflare/vite-plugin builds this
# `main` as the deployed worker: the Start server in SPA mode, serving the
# prerendered shell for client routes plus the same-origin observability relay
# (PostHog proxy at /diag, Sentry tunnel at /bugs -- src/routes/{diag,bugs}).
# nodejs_compat is required by @sentry/cloudflare.
main = "src/server.ts"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

# This worker serves via custom domains; explicitly keep workers.dev preview
# URLs on so `wrangler versions upload --preview-alias` (cd-preview) gets a
# reachable pr-<N> URL. Does not affect production routing. Deploys sync this
# setting declaratively -- leaving it unset let a production deploy flip the
# dashboard toggle back off, which broke CD Preview ravrun.
preview_urls = true

# Custom domains, wired up in the Cloudflare dashboard; declared here so the
# config is committed (same pattern as davidjfelix.com / monicandavid.com).
routes = [
  { pattern = "ravrun.com", custom_domain = true },
  { pattern = "rav.run", custom_domain = true },
]

[assets]
# directory is wired by @cloudflare/vite-plugin to the Vite client build output
# (which includes the prerendered SPA shell as index.html).
binding = "ASSETS"
# Serve index.html for unmatched paths (SPA deep links / refreshes). /diag and
# /bugs are worker routes (src/routes/{diag,bugs}) and never reach this binding.
not_found_handling = "single-page-application"
