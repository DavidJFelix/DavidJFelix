#:schema node_modules/wrangler/config-schema.json
name = "revision-city"
# Custom server entry (src/server.ts) wraps the TanStack Start handler with Sentry
# (@sentry/cloudflare withSentry); @cloudflare/vite-plugin needs this explicit
# entry instead of the default @tanstack/react-start/server-entry
# (cloudflare/workers-sdk#11100). Server-side Sentry reads VITE_PUBLIC_SENTRY_DSN
# (inlined at build, same as the client); no-op until it's set.
main = "src/server.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# This worker serves via custom domains; explicitly keep workers.dev preview
# URLs on so `wrangler versions upload --preview-alias` (cd-preview) gets a
# reachable pr-<N> URL. Does not affect production routing.
preview_urls = true

# GitHub App sign-in (src/diffs/lib/github-auth.ts, served under /api/auth/github)
# reads two secrets from the worker env: GITHUB_APP_CLIENT_ID and
# GITHUB_APP_CLIENT_SECRET. Set them with `wrangler secret put`; local dev reads
# them from .dev.vars (gitignored). Without them the auth routes return 503 and
# the viewer stays public-only. The app's public slug is not config -- it is a
# constant in src/diffs/lib/github-repo-access.ts, since one app serves every
# deploy today.

# Custom domains, wired up in the Cloudflare dashboard.
routes = [
  { pattern = "revision.city", custom_domain = true },
  { pattern = "www.revision.city", custom_domain = true },
]

[observability]
enabled = true

# The dev worker: a second deployment of this same app on a stable workers.dev
# host, used as the OAuth redirect target for per-PR previews. Previews cannot
# be registered as callback URLs (GitHub allows no wildcards), so they proxy
# sign-in through this one, which does have a registered callback on its own
# GitHub App. Selected at build time (CLOUDFLARE_ENV=dev): the Cloudflare vite
# plugin resolves the environment into dist/server/wrangler.json, which is what
# the redirected wrangler CLI deploys -- `-e dev` at deploy time is too late.
# Carries its own GITHUB_APP_CLIENT_ID / GITHUB_APP_CLIENT_SECRET (the dev
# GitHub App's), set with `wrangler secret put <KEY> --name revision-city-dev`.
[env.dev]
# Explicit rather than wrangler's derived `<name>-<env>`: previews upload as
# versions of this worker, and the sign-in proxy addresses it by name.
name = "revision-city-dev"
# `routes` is inheritable. Without this empty list, deploying the environment
# would reassign the production custom domains above to the dev worker.
routes = []
# The stable workers.dev host is the point -- it is the registered OAuth
# callback origin -- and the pr-<N> preview aliases hang off preview_urls.
workers_dev = true
preview_urls = true

[env.dev.vars]
# Where a per-PR preview (an uploaded version of this same worker) proxies
# sign-in. Previews share this worker's GitHub App secrets, so only the
# authorization code ever crosses origins. Production has no value here and
# never proxies. The stable host itself is not a preview hostname, so it runs
# the ordinary flow despite carrying the variable.
PREVIEW_AUTH_PROXY_URL = "https://revision-city-dev.nullserve.workers.dev"

[env.dev.observability]
enabled = true
