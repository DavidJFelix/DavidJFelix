#:schema node_modules/wrangler/config-schema.json
name = "djf-io"
# The worker entry: the @astrojs/cloudflare adapter's handler wrapped with
# Markdown for Agents content negotiation (src/lib/markdown-for-agents.ts).
# The build (via @cloudflare/vite-plugin) bundles it with the SSR manifest;
# on-demand routes (src/pages/bugs.ts, src/pages/diag) render here,
# prerendered pages are fetched from the assets below and converted to
# markdown when the request asks for it.
main = "src/worker.ts"
compatibility_date = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# Markdown for Agents negotiates on the Accept header, which only the worker
# can see, so page requests must reach it instead of being served straight
# from assets. The negated prefixes are pure static files (hashed bundles,
# fonts, images, the search index) that can never negotiate to markdown; they
# keep bypassing the worker entirely. The "!/@fs/*", "!/@id/*", "!/@vite/*",
# "!/src/*", "!/Users/*", and "!/node_modules/*" negations are dev-only: the
# vite plugin honors these rules in dev too, and vite serves module scripts,
# CSS, and /_image source files from those prefixes -- routed into the worker
# they 404 and no client JS runs. None exist as pages or assets in production,
# so there the patterns only turn the styled 404 page into a plain asset 404
# for probes of those paths.
run_worker_first = [
  "/*",
  "!/_astro/*",
  "!/@fs/*",
  "!/@id/*",
  "!/@vite/*",
  "!/src/*",
  "!/Users/*",
  "!/node_modules/*",
  "!/pagefind/*",
  "!/og/*",
  "!/favicon.svg",
  "!/robots.txt",
]

# Logs and traces ship to Grafana Cloud through the account-level
# observability destinations configured in the dashboard.
[observability.logs]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-logs"]

[observability.traces]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-traces"]
