# Canonical check tasks for this package. CI and automation discover checks
# here; tasks delegate to package.json scripts. Assumes `bun install` has run.

[tasks.typecheck]
description = "Type-check with tsc"
run = "bun run typecheck"

[tasks.lint]
description = "Lint with Oxlint + Biome"
run = "bun run lint"

[tasks.format]
description = "Check formatting (oxfmt; Prettier for md)"
run = "bun run format"

[tasks."format:fix"]
description = "Apply formatting fixes"
run = "bun run format:fix"

[tasks.test]
description = "Unit tests with Vitest"
run = "bun run test"

[tasks.check]
description = "Run all checks"
depends = ["typecheck", "lint", "format", "test"]
