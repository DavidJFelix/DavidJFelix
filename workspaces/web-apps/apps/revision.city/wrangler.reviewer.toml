#:schema node_modules/wrangler/config-schema.json
# The second Worker of this app. It holds the review harness (OpenCode), which
# is larger than the rest of the app. The Workers runtime parses each module of
# a Worker when the Worker starts, also a module that no code imports. Thus the
# harness in the `revision-city` Worker would make each start of the viewer
# slower. `vite build` makes the two Workers (vite.config.ts), and the deploy
# ships this one from `dist/revision_city_reviewer/wrangler.json`
# (bin/plan-affected-apps.ts).
name = "revision-city-reviewer"
main = "src/reviews/reviewer-worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# No public host: the Worker has no route, no workers.dev host, and no preview
# URLs. Other Workers of the account call the ReviewAgent Durable Object through
# a binding. Keep `workers_dev = false`: without it, wrangler gives a Worker
# that has no route a workers.dev host.
workers_dev = false
preview_urls = false

# The ReviewAgent reads one secret, OPENROUTER_API_KEY. Set it with
# `wrangler secret put OPENROUTER_API_KEY --name revision-city-reviewer`.
# Without it, each model call fails and the agent answers `unanswered`.

# A ReviewAgent runs OpenCode in its own SQLite database
# (src/reviews/review-agent.ts).
[[durable_objects.bindings]]
name = "REVIEW_AGENT"
class_name = "ReviewAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReviewAgent"]

# Logs and traces ship to Honeycomb through the account-level
# observability destinations configured in the dashboard.
[observability.logs]
enabled = true
destinations = ["honeycomb-logs"]

[observability.traces]
enabled = true
destinations = ["honeycomb-traces"]
