# Depot CI Migration
# Source: .github/workflows/cd-preview-f311x.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: CD Preview f311x
# Per-PR preview deploy for f311x (the preview-deployments proving ground).
# On every PR touching apps/f311x: deploy an isolated Alchemy stage (pr-<N>),
# smoke it, screenshot-diff it against committed baselines, and post the URL.
# On close: tear the stage down. Forks have no secrets and will fail the deploy
# step -- acceptable for a personal monorepo; do NOT switch to pull_request_target.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/f311x/**'
      - 'packages/theme/**'
      - '.depot/workflows/cd-preview-f311x.yml'
      - '.depot/actions/setup-playwright/**'
      - 'bin/install-playwright-deps.ts'
# One preview per PR; a new push cancels an in-flight preview. A close event
# shares the group so teardown supersedes any running preview.
concurrency:
  group: preview-f311x-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
defaults:
  run:
    working-directory: apps/f311x
jobs:
  preview:
    name: deploy + smoke + screenshots
    if: github.event.action != 'closed'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    # install (~1m) + deploy cap (10m) + smoke + screenshots, with headroom.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # Builds happen inside `alchemy deploy` (Cloudflare.Vite resource); the
      # wrapper resolves the deployed *.workers.dev URL into `url`.
      - name: deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.F311X_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.F311X_CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_NO_TUI: '1'
          ALCHEMY_TELEMETRY_DISABLED: '1'
        run: bun bin/deploy-preview.ts
      # A fresh pr-<N> stage Worker's workers.dev hostname reaches the edge
      # eventually and non-monotonically, per URL (PR #364: the stage's first
      # deploy served 404s past smoke's whole retry budget; the rerun passed).
      # Same readiness gate as the shared preview actions, on the fixed routes
      # smoke and screenshots fetch: the page and the chat endpoint (probeable
      # by GET; smoke POSTs it). $GITHUB_WORKSPACE resolves the repo-root
      # script despite the app-dir working directory.
      - name: await url ready
        env:
          READY_URL: ${{ steps.deploy.outputs.url }}
          READY_ROUTES: /,/agents/chat-agent/default
        run: bun "$GITHUB_WORKSPACE/bin/await-url-ready.ts"
      # Readiness of the fixed routes is proven above. The hashed client JS
      # asset is named per build inside the HTML, so the gate cannot probe it;
      # smoke's all-or-nothing chain keeps a longer retry window to ride out
      # that one URL's convergence (observed lagging / on the gate's first
      # outing, PR #368).
      - name: smoke test
        id: smoke
        env:
          SMOKE_URLS: ${{ steps.deploy.outputs.url }}
          SMOKE_ATTEMPTS: '12'
          SMOKE_RETRY_DELAY_MS: '5000'
        run: bun bin/smoke-test.ts
      # Browsers and apt debs both restore from cache; warm runs skip the apt
      # mirrors entirely.
      - name: setup playwright
        uses: ./.depot/actions/setup-playwright
      # PREVIEW_URL set => playwright.config.ts skips the local boot and points
      # at the deployed preview. `pnpm run` (not `mise run`) avoids the e2e
      # task's local build dependency, which the preview path doesn't need.
      - name: screenshots
        id: e2e
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm run test:e2e
      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/f311x/playwright-report/
          retention-days: 14
      # Shared with every wrangler app's preview via bin/comment-preview.ts; the
      # marker/title/footer make it f311x-specific. $GITHUB_WORKSPACE resolves
      # the repo-root script despite the app-dir working directory. Per-stage
      # outcomes keep the deployed-app link in the comment when only smoke or
      # screenshots fail.
      - name: comment preview url
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_MARKER: '<!-- f311x-preview -->'
          PREVIEW_TITLE: f311x preview
          PREVIEW_FOOTER: 'Stage `pr-${{ github.event.pull_request.number }}`; torn down automatically when this PR closes.'
          PREVIEW_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PREVIEW_SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PREVIEW_E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: bun "$GITHUB_WORKSPACE/bin/comment-preview.ts"
  teardown:
    name: destroy preview stage
    if: github.event.action == 'closed'
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: destroy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.F311X_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.F311X_CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_NO_TUI: '1'
          ALCHEMY_TELEMETRY_DISABLED: '1'
        run: bun bin/destroy-preview.ts
