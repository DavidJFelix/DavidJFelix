name: CD Deploy revision-city-dev (temporary)
# One-shot lane: deploys THIS BRANCH's revision.city as the dev worker so the
# per-PR preview sign-in on #409 can be exercised before merge -- the first
# real deploy replaces the hand-made placeholder and applies preview_urls.
# The dev worker normally tracks main via cd-deploy-web-apps.yml; DELETE THIS
# FILE from the PR before merge. It runs only when this file itself changes on
# the PR branch, so it cannot fire from other pushes.
on:
  push:
    branches: [claude/revision-city-symbol-tracking-5uyvgz]
    paths:
      - '.depot/workflows/cd-deploy-revision-city-dev.yml'
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TURBO_TELEMETRY_DISABLED: '1'
jobs:
  deploy:
    name: deploy revision-city-dev from branch
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup web-apps
        uses: ./.depot/actions/setup-web-apps

      # CLOUDFLARE_ENV=dev resolves [env.dev] into the emitted deploy config:
      # name revision-city-dev, routes [], workers_dev + preview_urls on. The
      # production worker and its custom domains are untouched.
      - name: turbo build
        env:
          CLOUDFLARE_ENV: dev
        run: bun bin/turbo-run.ts build --filter=./apps/revision.city

      - name: wrangler deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: workspaces/web-apps/apps/revision.city
