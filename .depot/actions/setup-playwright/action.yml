name: Setup Playwright
description: >-
  Install Playwright's Chromium and its system packages with both layers
  cached, keyed on the app's Playwright version: browser tarballs under
  ~/.cache/ms-playwright and the apt .deb archives under
  ~/.cache/playwright-apt (the path bin/install-playwright-deps.ts defaults
  to). Warm runs install the debs with dpkg and never touch the apt mirrors --
  the slow path that costs minutes of `apt-get update` plus package downloads
  on every fresh runner. Cold runs fall back to `playwright install` /
  `install-deps` and repopulate both caches. Run after pnpm install, with the
  job's working directory in the app: the Playwright version and `pnpm exec`
  resolve against the app's node_modules. Reference this action from workflow
  steps only -- never from inside another composite action. Run steps in a
  nested composite do not inherit the job's default working-directory, so the
  version resolve and `pnpm exec` would run at the repo root and fail; the
  preview-wrangler and preview-worker composites inline these steps instead.

runs:
  using: composite
  steps:
    - name: resolve playwright version
      id: pw-version
      shell: bash
      run: |
        version=$(node -p "require('@playwright/test/package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: cache playwright browsers
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

    - name: cache playwright system deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt
        key: playwright-apt-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

    - name: playwright install
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install chromium

    - name: playwright install-deps
      shell: bash
      run: bun "$GITHUB_WORKSPACE/bin/install-playwright-deps.ts"
