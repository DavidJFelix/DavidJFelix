# Bun install settings. minimumReleaseAge (seconds) is the supply-chain
# cooldown: dependency resolution skips versions published within the last
# 24 hours, matching the cooldown pnpm enforced by default. Bun does not
# inherit bunfig.toml from parent directories, so every app carries its own
# copy of this file.

# package.json "overrides" context: @modelcontextprotocol/sdk is pinned so
# @earendil-works/pi-ai dedupes to ONE physical copy. pi-ai's API-transport
# registry is module state, and @flue/runtime and the `agents` SDK declare
# peer ranges that can otherwise split it (#339 did) -- src/app.test.ts
# asserts the invariant. Drop once the two peers agree without help.

[install]
minimumReleaseAge = 86400
