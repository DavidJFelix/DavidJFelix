# Canonical check tasks for this app. CI runs the package scripts through turbo,
# and only the preview build runs a task here. Tasks delegate to package.json
# scripts. Assumes `bun install` has run.

[tasks.typecheck]
description = "Type-check with svelte-check"
run = "bun run typecheck"

[tasks.lint]
description = "Lint with Oxlint + Biome"
run = "bun run lint"

[tasks.format]
description = "Check formatting (oxfmt; Biome for astro/svelte; Prettier for md/mdx)"
run = "bun run format"

[tasks."format:fix"]
description = "Apply formatting fixes"
run = "bun run format:fix"

[tasks.test]
description = "Unit tests with Vitest"
run = "bun run test"

[tasks.build]
description = "Build with Vite"
run = "bun run build"

[tasks."db:generate"]
description = "Write the next D1 migration from src/lib/server/db/schema.ts into drizzle/ (drizzle-kit)"
run = "bun run db:generate"

[tasks.smoke]
description = "Smoke-test a local production boot (workerd via wrangler dev)"
depends = ["build"]
run = "bun run smoke"

[tasks."test:e2e"]
description = "E2E + visual-regression tests with Playwright (builds first)"
depends = ["build"]
run = "bun run test:e2e"

[tasks.check]
description = "Run all checks; typecheck waits for build, as in turbo, because build writes files that typecheck reads"
depends = ["lint", "format", "test", "build"]
run = "bun run typecheck"
