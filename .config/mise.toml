# Runtimes and the non-npm CLIs only. Every npm-distributed tool (biome,
# oxlint, oxfmt, prettier, cspell and its JUnit reporter, warden, pi) is a
# devDependency of the repo-root package.json, installed by `bun install` at
# the root and pinned by the root bun.lock; turbo lives in the web-apps
# workspace's package.json. The [env] block below puts their bins on PATH.
[tools]
node = "26"
# bun is the app package manager and script runner (and runs the deploy/smoke
# scripts in apps/*/bin -- repo rule: scripts are bun, not bash). Declared here
# because CI's `mise install` runs at the repo root and does not read app-level
# mise.toml [tools]. Node stays the toolchain runtime for vitest, Playwright,
# wrangler, and the framework CLIs.
bun = "1.4.2"
actionlint = "1"
ghalint = "1"
zizmor = "1.30.0"
pinact = "4.1.1"
depot = { version = "latest", exe = "depot" }
# worktrunk (`wt`): git-worktree manager backing the one-workspace-per-agent
# flow. Landing rule: push + PR from the workspace; `wt merge` is not the flow.
worktrunk = "latest"

# The root package.json's bins (biome, oxlint, oxfmt, prettier, cspell, warden,
# pi) resolve from any directory once mise is activated, the way its shims did
# when these were mise tools -- https://mise.jdx.dev/mise-cookbook/nodejs.html.
# `bun run` inside an app already walks up to this directory on its own, so
# app scripts find the same copies without activation.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Repo-root checks, scoped to the config files the root owns. Legacy project
# dirs and isolated workspace trees are intentionally out of scope; the
# web-apps workspace shadows these tasks per project, orchestrated by turbo.
# biome.jsonc and .oxlintrc.jsonc live at the web-apps workspace root (turbo
# hashes them there) but the repo-root task still formats and lints them.
# Biome refuses to lint its own config as a *nested* root config, so this runs
# from the workspace directory where that config is the project root.
[tasks."format:workspace-config"]
description = "Lint the web-apps workspace Biome config"
run = "biome lint biome.jsonc"
dir = "{{config_root}}/workspaces/web-apps"

[tasks.format]
description = "Check formatting of repo-root config files (oxfmt; Biome lints its own configs)"
depends = ["format:workspace-config"]
# --ignore-path: the root .prettierignore ignores everything but md/mdx (it
# scopes Prettier), which would blank oxfmt's explicit file list too
run = [
  "oxfmt --check --ignore-path=.gitignore package.json workspaces/web-apps/biome.jsonc .oxfmtrc.json workspaces/web-apps/.oxlintrc.jsonc .prettierrc.json .config/cspell.jsonc .github/renovate.json .vscode/settings.json .vscode/extensions.json",
  "biome lint .vscode/settings.json .vscode/extensions.json",
]
dir = "{{config_root}}"

[tasks."format:fix"]
description = "Apply formatting fixes to repo-root config files"
run = "oxfmt --ignore-path=.gitignore package.json workspaces/web-apps/biome.jsonc .oxfmtrc.json workspaces/web-apps/.oxlintrc.jsonc .prettierrc.json .config/cspell.jsonc .github/renovate.json .vscode/settings.json .vscode/extensions.json"
dir = "{{config_root}}"

[tasks."format:md"]
description = "Check repo-owned Markdown formatting (Prettier; scope set by .prettierignore)"
run = "prettier --check ."
dir = "{{config_root}}"

[tasks."format:md:fix"]
description = "Apply Prettier formatting to repo-owned Markdown"
run = "prettier --write ."
dir = "{{config_root}}"

[tasks."changelog:rollup"]
description = "Fold docs/changelog/fragments/ into the monthly changelog files"
run = "bun bin/changelog-rollup.ts"
dir = "{{config_root}}"

[tasks.spell]
description = "Spell-check repo-owned sources (cspell)"
run = "cspell --config .config/cspell.jsonc --no-progress --dot 'workspaces/web-apps/**' 'docs/**' 'bin/**' '*.md' '.agents/agents/**' '.config/**' '.github/**'"
dir = "{{config_root}}"

# Same check, reported as JUnit XML for Depot's test results view. The reporter
# is a root devDependency beside cspell, so it resolves by package name; it
# writes to stdout, so the report is the redirected output.
[tasks."spell:ci"]
description = "Spell-check like `spell`, writing a JUnit report to test-results/ instead of the console (CI)"
run = [
  "mkdir -p test-results",
  "cspell --config .config/cspell.jsonc --no-progress --dot --reporter @cspell/cspell-junit-reporter 'workspaces/web-apps/**' 'docs/**' 'bin/**' '*.md' '.agents/agents/**' '.config/**' '.github/**' > test-results/cspell-junit.xml",
]
dir = "{{config_root}}"

[tasks."test:bin"]
description = "Unit-test the repo-root bin/ scripts (bun test)"
run = "bun test bin/"
dir = "{{config_root}}"

[tasks."check:agents"]
description = "Verify agent persona frontmatter and the .claude/agents symlink mirror"
run = "bun bin/check-agents.ts"
dir = "{{config_root}}"

# Workspace aggregators: turbo (a devDependency of workspaces/web-apps) runs
# the web-apps task graph (all apps and packages) with caching;
# bin/turbo-run.ts feeds repo-root config into the cache key. These are the
# local "verify everything" commands and the same entry point CI uses.
[tasks.test]
description = "Run every web-apps project's unit tests (turbo)"
run = "bun bin/turbo-run.ts test"
dir = "{{config_root}}"

[tasks.check]
description = "Run every web-apps project's full check (turbo: typecheck, lint, format, build, test)"
run = "bun bin/turbo-run.ts typecheck lint format build test"
dir = "{{config_root}}"

# Serial on purpose. Every smoke boots a real production server (workerd, node,
# nuxt); eleven at once starve each other past their 60s readiness timeout, and
# the per-app workflows this replaced hid that by giving each app its own
# runner. Ports are unique per app regardless -- see each bin/smoke-local.ts.
[tasks.smoke]
description = "Boot every deployable app's production build and smoke it (serial)"
run = "bun bin/turbo-run.ts smoke --concurrency=1 --continue"
dir = "{{config_root}}"
