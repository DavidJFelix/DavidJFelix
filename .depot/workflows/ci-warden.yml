# Warden — AI code review on every ready PR, plus a dispatch path for branches.
#
# Adapted from `warden init`'s generated .github/workflows/warden.yml to this
# repo's conventions (Depot runners, pinned SHAs, persist-credentials off).
#
# Always-on for non-draft PRs (review job): the getsentry/warden action
# reviews the PR's head on open, reopen, ready-for-review, and every push,
# posting inline comments + a check. Drafts are skipped until marked ready,
# and PRs opened by the repo's GitHub App (Renovate bumps, the changelog
# roll-up) are skipped outright. The "Warden" label is the manual lever:
# adding it re-runs a review on the current head (remove and re-add to re-run
# again) and opts a draft or a bot PR in.
# warden.toml's triggers mirror the same filter. This was label-only from
# 2026-07-05 (per-push spend on the model of the day added up); it went back
# to always-on 2026-09-19 once WARDEN_MODEL pointed at a model cheap enough
# that per-push reviews at high effort are a rounding error.
#
# Second lever, its own job:
#   - workflow_dispatch on any branch (dispatch-review job): the action cannot
#     review from a dispatch event (its analyze/report modes require a
#     pull_request event; dispatch routes to schedule-type sweep triggers), so
#     this path runs the warden CLI pinned in the repo-root package.json
#     (installed by setup-mise) on the dispatched branch, diffed from its
#     merge-base with the `base` input (default main).
#     Findings print to the job log and the run fails per warden.toml's
#     failOn; nothing is posted to a PR.
#
# Two deliberate deviations from docs/contributing/github-actions-style.md,
# both because Warden reviews the whole PR diff rather than one subtree:
#   - No `paths:` filter. Like ci-spell.yml, this is a repo-wide gate; scoping
#     it to a subtree would blind the review to everything else in the diff.
#   - No `push` to main. Warden reviews a change set (PR diff or branch
#     range); there is nothing for it to review on a push.
#
# Config lives in /warden.toml. The model (WARDEN_MODEL) and OpenRouter key
# (WARDEN_OPENROUTER_API_KEY) come from Depot secrets — these workflows run on
# Depot CI, which never sees GitHub repo secrets.
name: CI Warden
on:
  pull_request:
    # `labeled` stays so adding the "Warden" label re-runs the review; the
    # job-level guard below decides which label counts.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref the dispatched branch is diffed against
        required: false
        default: main

jobs:
  review:
    name: warden
    # Job-level copy of warden.toml's trigger filter, so skipped events never
    # allocate a runner (the toml filter would only no-op after checkout +
    # mise): non-draft PRs run on every non-label event; on a `labeled` event
    # only the "Warden" label runs, and it runs for drafts too (the opt-in).
    # Bot PRs are excluded from the automatic path: Renovate's dependency PRs
    # and the weekly changelog roll-up are both opened by the repo's GitHub App
    # (login `djf-renovate[bot]`), and reviewing a lockfile bump or a folded
    # changelog is spend without signal. warden.toml cannot filter on author,
    # so this guard is the only place that rule lives. The label path still
    # applies, so adding "Warden" reviews a bot PR when one deserves it.
    if: >-
      github.event_name == 'pull_request' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'Warden') ||
        (
          github.event.action != 'labeled' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.user.login != 'djf-renovate[bot]'
        )
      )
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20
    # contents: write is required for resolving review threads via GraphQL.
    # See: https://github.com/orgs/community/discussions/44650
    permissions:
      contents: write
      pull-requests: write
      checks: write
    # No GITHUB_TOKEN env: the warden action's github-token input already
    # defaults to the workflow token, and an env copy would also expose it to
    # every child process of the model-backed analyze step.
    env:
      WARDEN_MODEL: ${{ secrets.WARDEN_MODEL }}
      WARDEN_OPENROUTER_API_KEY: ${{ secrets.WARDEN_OPENROUTER_API_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # getsentry/warden is a composite action that runs bare `node
      # dist/action/index.js`, so it uses whatever Node is on PATH. The runner's
      # default is Node 20, on which the action's bundled undici (>=8.0.3) throws
      # `TypeError: webidl.util.markAsUncloneable is not a function` (the API
      # landed in Node 22.10; see nodejs/undici#5024). setup-mise puts the
      # repo-pinned Node (26) on PATH, which has it.
      - name: mise
        uses: ./.depot/actions/setup-mise
      # Split analyze/report per the Warden GitHub guide. Note: both steps use
      # the workflow token (the action input's default), so with this setup the
      # split is a structural findings handoff, not a credential boundary; a
      # separately minted report-only app token would be needed for that.
      - name: warden analyze
        id: warden-analyze
        uses: getsentry/warden@775db57bee73caaeb6dcdafd5b56fd472dd6a0bc # v0.48.0
        with:
          mode: analyze
      - name: warden report
        uses: getsentry/warden@775db57bee73caaeb6dcdafd5b56fd472dd6a0bc # v0.48.0
        with:
          mode: report
          findings-file: ${{ steps.warden-analyze.outputs.findings-file }}
      # Warden posts inline comments only for findings on a diff line, so a
      # clean run is visible only as check runs on the commit. This keeps one
      # sticky PR comment current with the latest run's per-skill summary, so
      # the conversation shows Warden looked at the head. (`reportOnSuccess`
      # in warden.toml would be the built-in way, but 0.48.0 drops a body-only
      # COMMENT review before posting, so it is inert.) Runs even when the
      # report step failed the check on findings -- that is exactly when the
      # summary matters -- but not without a findings file to summarize.
      - name: comment-warden-summary
        if: always() && steps.warden-analyze.outputs.findings-file != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FINDINGS_FILE: ${{ steps.warden-analyze.outputs.findings-file }}
        run: bun bin/comment-warden-summary.ts

  dispatch-review:
    name: warden (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    # Log-only: the CLI posts nothing, so read is all this job needs.
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      WARDEN_MODEL: ${{ secrets.WARDEN_MODEL }}
      WARDEN_OPENROUTER_API_KEY: ${{ secrets.WARDEN_OPENROUTER_API_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base and the two-dot diff need real history for both the
          # dispatched branch and the base, not a depth-1 snapshot.
          fetch-depth: 0
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: warden run
        env:
          # Indirection instead of inlining ${{ inputs.base }} in `run:` keeps
          # the dispatch input out of shell-template position (zizmor
          # template-injection).
          BASE: ${{ inputs.base }}
        # The CLI only accepts two-dot ranges (a bare ref is treated as a file
        # pattern and warns "no files matched"; three-dot fails to parse), so
        # compute the merge-base here — reviewing only the branch's own
        # commits, not whatever the base gained since the branch point.
        run: mise exec -- warden run "$(git merge-base "origin/${BASE}" HEAD)..HEAD"
