#:schema node_modules/wrangler/config-schema.json
name = "monicandavid-com"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# This worker serves via custom domains; explicitly keep workers.dev preview
# URLs on so `wrangler versions upload --preview-alias` (cd-preview) gets a
# reachable pr-<N> URL. Does not affect production routing.
preview_urls = true

# Custom domains, wired up in the Cloudflare dashboard.
routes = [
  { pattern = "monicandavid.com", custom_domain = true },
  { pattern = "www.monicandavid.com", custom_domain = true },
]

# Logs and traces ship to Grafana Cloud through the account-level
# observability destinations configured in the dashboard.
[observability.logs]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-logs"]

[observability.traces]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-traces"]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
