<!--
  forzamonica art mark: the "fm" of forzamonica, in the letterforms the page's
  own h1 renders.

  The two paths are the `f` and `m` outlines of Newsreader Italic, taken from
  the same font file src/styles.css self-hosts
  (@fontsource-variable/newsreader, OFL-1.1), instantiated at the settings the
  h1 resolves to: weight 500 and optical size 44, since `textStyle: displayXl`
  sets 44px and browsers default to `font-optical-sizing: auto`. Newsreader
  redraws the pair as the optical size moves, so a different one here would put
  a visibly different `f` in the tab than the one above the page. The pair keeps
  the font's own f/m kern, and the combined ink box is scaled to fill the 32x32
  tile with 1px to spare.

  Outlines rather than a <text> element: browsers render an SVG favicon in a
  context that loads no external resources, so a font-family reference would
  fall back to the system serif. Re-extract from the woff2 in node_modules if
  the font package ever redraws the italic.

  Colors are the design system's ink and paper (panda.config.ts). The mark
  carries no tile, matching davidjfelix.com and djf.io, and inverts with the
  browser chrome because ink on a dark tab strip would disappear.

  Note for editors: XML forbids a double hyphen inside a comment, so this block
  cannot use the repo's usual em dash.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="forzamonica art">
  <style>
    .glyph { fill: #1e2a3a; }
    @media (prefers-color-scheme: dark) {
      .glyph { fill: #f7f9fa; }
    }
  </style>
