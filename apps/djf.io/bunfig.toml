# Bun install settings. minimumReleaseAge (seconds) is the supply-chain
# cooldown: dependency resolution skips versions published within the last
# 24 hours, matching the cooldown pnpm enforced by default. Bun does not
# inherit bunfig.toml from parent directories, so every app carries its own
# copy of this file.

# package.json "overrides" context: rolldown is pinned to 1.1.4 -- 1.1.5 drops
# vite-ignored external dynamic imports (the pagefind loader in Search.astro)
# from chunk dynamicImports metadata, so Astro's script inliner pulls the chunk
# into the page HTML before Vite substitutes the __VITE_PRELOAD__ marker and
# every page throws. The Search e2e suite covers the unpin.

[install]
minimumReleaseAge = 86400
