# Depot CI Migration
# Source: .github/workflows/ci-spell.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: CI spell
# Repo-wide spell check. Unlike the per-app and root-config workflows, this has no
# paths filter: cspell is a universal gate that runs on every push and PR.
on:
  push:
    branches: [main]
  pull_request:
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  spell:
    name: spell check (cspell)
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise
        uses: ./.depot/actions/setup-mise
      - name: spell
        run: mise run spell:ci
      # Uploads the JUnit report so Depot's test results view lists each
      # misspelling; Depot CI authenticates the upload with its native OIDC, no
      # token or id-token permission needed. Runs after a failed spell step too,
      # since that is the run whose report matters.
      - name: test-report-action
        uses: depot/test-report-action@2ad5779840a9c63e884fa26f11d019768a27a941 # v1.0.1
        if: ${{ !cancelled() }}
        with:
          path: test-results/cspell-junit.xml
