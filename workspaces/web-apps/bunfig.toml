# Bun install settings for the web-apps workspace. minimumReleaseAge (seconds)
# is the supply-chain cooldown: dependency resolution skips versions published
# within the last 24 hours, matching the cooldown pnpm enforced by default.
# One copy at the workspace root now covers every app and package -- installs
# run here, not per project.

# Root package.json "overrides" context (bun applies overrides from the
# workspace root only, so the per-app pins live there):
# - rolldown is pinned to 1.2.1 to converge every consumer on one version
#   (alchemy pins 1.1.5 exactly, nuxt 4.5.1 wants ^1.2.0). It was held at
#   1.1.4 from 2026-07 to 2026-08-03 for djf.io's pagefind loader, but that
#   hold-back was misdiagnosed: the loader broke again ON 1.1.4, so no
#   rolldown version was ever the trigger. Search.astro no longer routes the
#   pagefind import through Vite's preload helper, so the bundler can't break
#   it and this pin is free to move on its own merits. Verify any change with
#   djf.io's e2e run under CI=1 -- playwright's reuseExistingServer is on
#   without it and will silently test a stale build against the old server.
# - the @distilled.cloud pins track alchemy 2.0.0-beta.67 for f311x (the
#   release-age cooldown rejects day-of releases), so they move with every
#   alchemy bump -- alchemy depends on them by exact version, and a stale pin
#   silently holds the old ones under the new alchemy.
# - effect and @effect/platform-node-shared are pinned to the same version as
#   f311x's direct effect/@effect/platform-node so exactly ONE physical effect
#   lands in the tree; mixed copies are the prime suspect for the SchemaAST
#   TypeError chased on 2026-06-11. This is a floor, not a cap -- the beta.94
#   cap was for effect beta.97 removing Schedule.either, which alchemy beta.62
#   migrated onto the new Schedule API, and beta.67 now requires effect >=
#   4.0.0-beta.100. (The pi-ai, @modelcontextprotocol/sdk, and hono pins that
#   used to sit beside these existed to dedupe onvibes.org's Flue dependency
#   tree; they left with Flue in 2026-08.)

# Root package.json "devDependencies" context: @astrojs/check + typescript
# 6.0.3 live at the workspace ROOT, and the Astro apps deliberately do not
# declare @astrojs/check themselves. astro check is built on the TypeScript JS
# compiler API, which typescript 7 (native) does not ship, and @astrojs/check
# resolves its typescript peer beside its own instance
# (createRequire(import.meta.url)) -- so wherever it is declared decides which
# compiler checks the .astro files. Declared in an app it would peer with the
# app's typescript 7 and crash at startup; declared only at the root it peers
# with the root's 6.0.3, and `astro check` in each app finds it by walking up
# (astro's getPackage resolves from the app dir with normal node resolution).
# The apps keep typescript 7 for everything else. Renovate holds the root
# typescript below 7; both move to the app manifests again when the Astro
# language server runs on the native compiler
# (https://github.com/withastro/roadmap/discussions/1321, expected ~7.1).

# Root package.json "workspaces.catalog" context: the @tanstack entries exist
# so no app declares the `latest` dist-tag -- frozen installs re-resolve
# dist-tags, so an upstream release alone invalidated the lockfile (2026-08-06
# and 2026-08-08 both). react-router and router-plugin must stay the exact
# versions react-start pins internally (react-start's dependency list is the
# source of truth); bump the catalog as one aligned set. This replaced the
# four @tanstack overrides from 2026-08-06 -- with exact aligned versions
# there is no float left to split the tree into two routers. react-devtools
# and devtools-vite version independently and can move on their own.

# Direct dependencies that exist only to pin resolution, not because the app
# imports something new:
# - pkg.dog declares h3 ^1.15.11 even though nuxt already brings it. f311x's
#   @tanstack/start-server-core depends on "h3-v2": "npm:h3@2.0.1-rc.20", and
#   bun hoists that alias under its REAL name, so a bare `h3` in this shared
#   workspace could resolve to v2. Nuxt's generated .nuxt/tsconfig.json mapped
#   h3 there while nitro 2.13.4 bundled v1, so pkg.dog's server routes
#   typechecked against v2 (no toWebRequest) and ran against v1. The direct
#   dep makes types and runtime agree. Drop it when nothing pulls an aliased
#   h3 v2, or when nitro itself moves to v2 and the routes move with it.

[install]
minimumReleaseAge = 86400
