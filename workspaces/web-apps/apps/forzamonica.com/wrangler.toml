#:schema node_modules/wrangler/config-schema.json
name = "forzamonica-com"
# Custom server entry (src/server.ts) wraps the TanStack Start handler with Sentry
# (@sentry/cloudflare withSentry); @cloudflare/vite-plugin needs this explicit
# entry instead of the default @tanstack/react-start/server-entry
# (cloudflare/workers-sdk#11100). Server-side Sentry reads VITE_PUBLIC_SENTRY_DSN
# (inlined at build, same as the client); no-op until it's set.
main = "src/server.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# forzamonica.com is not registered yet, so the worker serves from its
# workers.dev URL. Once the domain is owned and its zone is in the account
# (see GitHub issue #223), add:
# routes = [
#   { pattern = "forzamonica.com", custom_domain = true },
#   { pattern = "www.forzamonica.com", custom_domain = true },
# ]

# Logs and traces ship to Grafana Cloud through the account-level
# observability destinations configured in the dashboard.
[observability.logs]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-logs"]

[observability.traces]
enabled = true
destinations = ["2026-aug-16-grafana-cloud-traces"]

[vars]
# mock.shop is Shopify's hosted mock Storefront API -- full schema, no store or
# token required. Cutover to the real store is config-only: point this at
# https://<store>.myshopify.com/api/<version>/graphql.json and set the
# SHOPIFY_STOREFRONT_PUBLIC_TOKEN secret (`wrangler secret put`).
SHOPIFY_STOREFRONT_API_URL = "https://mock.shop/api"

# The landing's mailing-list signup calls the Loops (loops.so) Contacts API from
# its server function. Off until the LOOPS_API_KEY secret is set
# (`wrangler secret put LOOPS_API_KEY`; `.dev.vars` locally) -- submissions fail
# soft into the form's error state until then.
